# 配置版本号，由插件自动管理，请勿修改。插件更新后会据此自动升级本文件，自定义内容保留
config_version: 1

# ============================================================
# ALFakePlayer 主配置文件 (config.yml)
# ============================================================
# 数据库（SQLite / MySQL）与 Redis 设置在同目录的 database.yml
# 菜单布局在 menus/ 目录，消息文本在 lang/ 目录
# 所有修改都需要重启服务器才会生效
# ============================================================

# ── 服务器标识 ────────────────────────────────────────────
# 本服在跨服网络中的唯一 ID，必须与 BungeeCord/Velocity 配置中的子服名称一致
# 跨服传送会按这个 ID 把玩家送到假人所在的子服；每个子服必须不同
# 单服部署可保持默认值
# 重要：跨服前先改好此值。接入跨服后若改动，旧 ID 下仍在运行的假人
#       要等 database.yml 中 sync.timeout_seconds 超时后才能被其他子服接管
server_id: "server"
# 这个服务器显示的名字，仅用于菜单和消息展示
server_name: "一号服务器"

# ── 语言 ──────────────────────────────────────────────────
# 消息与指令帮助的语言：zh_CN（简体中文）或 en_US（English）
language: zh_CN

# ── 假人栏位 ──────────────────────────────────────────────
slots:
  # 新玩家默认解锁的栏位数。玩家仍需购买或由管理员发放假人
  default: 1
  # 每名玩家最多拥有的假人数量（1–100）
  max_per_owner: 10
  # 本服同时在线的假人上限（0–200）；跨服时每个子服分别计算
  # 设为 0 禁止在本服召唤假人，也不能把其他子服的假人召回本服；
  # 玩家仍可在本服打开菜单、购买假人、查看背包，传送到其他子服的假人身边
  # 运行中改为 0 后执行 /afp reload，本服已召唤的假人会被收回，背包和设置保留
  max_active_server: 20
  # 关服时本服正在运行的假人，开服后是否在原来的位置召唤回来（不收费；背包、设置、生命和饱食度保留）
  # 只在正常关服（stop）时记录，服务器崩溃时来不及记录；主人的假人数被调低或本服在线上限已满时不召唤
  # 设为 false：关服后假人收回，开服后需要重新召唤
  restore_after_restart: true

# ── 购买假人 ──────────────────────────────────────────────
# 购买得到一个新的未召唤假人，与每次召唤的费用（economy）无关
# 金币、点券和物品可以同时要求，玩家必须全部满足才能购买，例如 300 金币 + 50 点券
# 所需物品不写在本文件：请在游戏内用 /afp items 设置（最多三组，完整匹配物品数据），
# 保存在数据库中，跨服时所有子服共用，设置后立即生效，不会改写配置文件
# 金币、点券都为 0 且没有设置物品时，购买免费
purchase:
  # 金币价格，需要 Vault 和经济插件；0 为不收金币
  coins: 300.0
  # 点券价格，需要 PlayerPoints；0 为不收点券
  points: 0

# ── 权限组 ──────────────────────────────────────────────
luckperms:
  # 召唤时让假人加入的 LuckPerms 权限组，该组必须已存在；未安装 LuckPerms 时忽略
  # 不要给这个组配置管理权限或领地绕过权限
  group: 'default'

# ── 皮肤 ──────────────────────────────────────────────────
skins:
  # 给假人（召唤的假人和 /afp test 的测试假人）随机套上皮肤，同一个假人一直是同一个皮肤
  enabled: true
  # 从这些正版玩家名的皮肤里随机挑；留空时用 tab_test.yml 的名字表，其中没有正版账号的名字会跳过
  # 装了 SkinsRestorer 时通过它获取（用它的缓存和代理设置），还可以填皮肤图片链接；没装时直接从 Mojang 获取
  # 获取到的皮肤保存在 skin-cache.yml，之后不再联网。挑中的皮肤还没获取到时先用原版默认皮肤：
  # 测试假人获取到后立即换上，召唤的假人下次召唤时换上
  names: []

# ── 领地插件 ──────────────────────────────────────────────
claims:
  # 这些领地插件判断假人的权限时，把假人当作它的主人：
  #   · 主人自己的领地，以及主人有权限的别人的领地里，假人和主人的权限相同（挖掘、放置、攻击、开箱子、捡东西等）
  #   · 主人没有权限的地方，假人同样没有权限
  #   · 不需要在领地里单独添加假人；领地里主人的权限改了，假人马上跟着变
  #   · 只按领地里的成员和权限设置判断，不继承主人的权限节点（例如领地插件的管理员、绕过权限）
  # 其他插件仍把假人当作独立的玩家
  # 已适配 Dominion 和 Residence。其他按玩家 UUID 判断权限的领地插件（例如 GriefPrevention、Lands、HuskClaims）
  # 也可以加进来：填 /plugins 中显示的插件名，不区分大小写，添加后请先测试
  # 设为 [] 关闭：假人在领地里和陌生玩家一样
  plugins:
    - Dominion
    - Residence

# ── EasyBot（QQ 群服互通） ────────────────────────────────
easybot:
  # 装了 EasyBot 时，群里查询本服在线玩家，列表里也有本服的假人，和真人一样；没装 EasyBot 时不起作用
  # 修改后执行 /afp reload 生效
  enabled: true
  # 列表里包括召唤的假人
  summoned_fake_players: true
  # 列表里包括 /afp test 的 TAB 测试假人
  test_players: true

# ── 召唤费用 ──────────────────────────────────────────────
economy:
  # 是否对每次召唤收费（包括死亡后重新召唤），需要 Vault 和经济插件
  # 开启后，选择档位时会先打开召唤确认菜单；把跨服运行中的假人召回本服不再收费
  # 没有 Vault 经济服务时无法召唤，请安装经济插件或改为 false
  enabled: true
  # 各档位每次召唤的金币价格（不能为负数）
  tier_prices:
    normal: 300.0
    pro: 600.0
    promax: 1000.0

# ── 传送 ──────────────────────────────────────────────────
# 权限 alfakeplayer.teleport.bypass（默认 OP）可跳过等待和冷却
teleport:
  # /afp tp 传送到假人前的等待秒数（0–300），0 为立即传送
  to_dummy_delay_seconds: 5
  # /afp tp 成功后的冷却秒数（0–300），0 为无冷却；按玩家计算，跨服传送同样适用
  to_dummy_cooldown_seconds: 5

# ── 性能 ──────────────────────────────────────────────────
performance:
  # 各档位假人的运行范围：以假人所在区块为中心，边长为 N 个区块的正方形
  # 范围内和真人在场时一样运行：生物移动和自然生成、红石、漏斗、熔炉、作物生长都会工作
  # 范围外的区块不运行
  #
  # 可填 3、5、7、9，对应 3×3、5×5、7×7、9×9 个区块
  #   · 最小 3：假人挖矿和卸货会伸到相邻区块，再小的话掉落物会落进不运行的区块，捡不起来
  #   · 最大 9：范围越大越耗性能，运行的区块数是边长的平方（3→9 个，5→25 个，7→49 个，9→81 个）
  #   · 填偶数按小一档算（4 等于 3），小于 3 按 3 算，大于 9 按 9 算
  #
  # 由服主在这里为每个档位分别设置；玩家召唤时选择档位，价格见上方 economy.tier_prices
  # 运行范围外，服务端还会多加载一圈不运行的区块（Paper 限制，无法关闭），几乎不占用 CPU
  # 刷怪提示：自然刷怪要离假人 24 格以上。3×3 只有 48×48 格，刷怪塔需整体放在范围内
  dummy_chunks:
    normal: 3
    pro: 5
    promax: 7
  # 找不到工作目标时的初始扫描间隔（tick，1–20）
  idle_target_interval_ticks: 3
  # 持续找不到目标时，扫描间隔逐步放慢到的上限（tick）
  idle_target_max_ticks: 20
  # 放置方块的最短间隔（tick，最少 4）
  use_interval_ticks: 4
  # 把假人背包和设置定时写入数据库的间隔（tick，40–12000）；只写入有变化的数据
  save_interval_ticks: 200
  # 假人是否像真人一样让周围自然生成生物（刷怪塔需要开启）
  # 关闭可明显减轻假人多时的刷怪和实体负载，但依赖假人的刷怪塔将不再出怪
  affects_spawning: true
  # 附近只有假人、没有真人时，是否禁止自然生成非敌对生物
  #   · 包括牛、羊、猪、鸡等动物，以及鱼、鱿鱼、海豚、美西螈、蝙蝠
  #   · 敌对生物不受影响，依赖假人的刷怪塔照常出怪
  #   · "附近"按原版的生物消失距离判断：鱼为 64 格，其余为 128 格
  #   · 有真人在附近时按原版规则生成；新生成的区块自带的动物不受影响
  # 设为 false：假人周围会像真人在场一样生成这些生物
  passive_spawns_need_real_player: true

# ── 搬运货物 ──────────────────────────────────────────────
unloading:
  # 全局开关。开启后，假人在「行为设置」中开启「搬运货物」时，
  # 会把主背包的物品放进同高度、水平相邻的箱子；快捷栏、副手和装备不搬
  # 开启搬运的假人，主背包放不下的掉落物不会再捡（不会塞进快捷栏），卸货腾出空间后继续捡
  enabled: true
  # 卸货检查间隔（tick，20–1200）
  interval_ticks: 40
  # 箱子装满或无法打开时，重试间隔逐步放慢到的上限（tick）
  max_retry_ticks: 160
  # 卸货时留给假人吃的食物数量（0–2304）。快捷栏和副手里的食物也算在内，多出来的食物照常搬走
  # 设为 0 时主背包里的食物全部搬走
  keep_food: 64

# ── 生存 ──────────────────────────────────────────────────
survival:
  # true：敌对怪物不会锁定假人，怪物的近战和弹射物伤害会被拦截
  # 饥饿、窒息等环境伤害和真人攻击不受影响；设为 false 恢复原版行为
  ignore_hostile_mobs: true
  # 饱食度（0–20 点，2 点为一格鸡腿）不高于该值时，假人用副手进食
  auto_eat_at_food_level: 2
  # 工具剩余耐久不高于该值时停用并换下，防止工具损坏（最少 1）
  minimum_tool_durability: 1
  # 假人不会主动食用的食物
  food_blacklist:
    - ROTTEN_FLESH
    - BEEF
    - PORKCHOP
    - CHICKEN
    - MUTTON
    - RABBIT
    - COD
    - SALMON
    - TROPICAL_FISH
    - PUFFERFISH
  # 假人每秒额外的饥饿消耗（0–4）。设为 0 时，静止的假人不会因站着而掉饱食度
  passive_exhaustion_per_second: 0.1
  # true：简单和普通难度下饥饿也会致死（原版只在困难难度致死）
  lethal_starvation_any_non_peaceful_difficulty: true
