    - '&b%command% list &8- &7查看假人和在线状态'
    - '&b%command% b <编号> &8- &7打开背包'
    - '&b%command% dir <编号> &8- &7按你当前的视角更新工作朝向'
    - '&b%command% rename <编号> <名字> &8- &7改名，消耗一张改名卡'
    - '&b%command% delete <编号> &8- &7永久删除，背包和设置一并清除'
  # 需要 alfakeplayer.teleport 权限才显示
  teleport:
    - '&b%command% tp <编号> &8- &7传送到假人身边；在其他子服时把你送过去'
    - '&b%command% tph <编号> &8- &7把假人拉到你身边；在其他子服时召回本服，不再收费'
  admin_hint:
    - '&7管理员指令：&b%command% admin help'
  # 管理员帮助：/afp admin help，只有管理员可以查看
  admin:
    - '&8&m──────&r &b&lALFakePlayer &7管理员指令 &8&m──────'
    - '&8[参数] 可省略，<参数> 必填；后台输入时不加 /'
    - '&b%command% grant <玩家> <数量> &8- &7给玩家增加假人'
    - '&b%command% set <玩家> <总数> &8- &7把玩家的假人补到指定数量'
    - '&b%command% card <玩家> [数量] &8- &7发放改名卡（玩家需在线）'
    - '&b%command% items &8- &7设置购买所需物品（游戏内）'
    - '&b%command% b <玩家> <编号> &8- &7打开任意玩家假人的背包，可取放物品（游戏内）'
    - '&b%command% despawn <名字> &8- &7收回任意玩家的假人，支持其他子服'
    - '&b%command% delete <名字> &8- &7永久删除任意玩家的假人'
    - '&b%command% clear [服务器ID|all] &8- &7清除本服、指定子服或全部子服的在线假人，存档保留'
    - '&b%command% servers &8- &7查看各子服在线状态'
    - '&b%command% reload &8- &7重载配置、菜单和语言文件；本服已召唤的假人会暂时收回，再在原位置召唤回来'
    - '&b%command% test <数量>|stop &8- &7在 TAB 列表显示或清除测试假人'
