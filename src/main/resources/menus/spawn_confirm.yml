# 配置版本号，由插件自动管理，请勿修改。插件更新后会据此自动升级本文件，自定义内容保留
config_version: 2

# 召唤确认 — 召唤收费时，选择档位后打开
#
# 布局：shape 每行 9 个字符（1–6 行），每个字符是一个格子，"." 为空格子；用到的字符在 items 中定义
# 颜色代码使用 & 符号；name 为名称，lore 为描述
#
# 菜单图标写法：
# 1. 原版物品：
#    type: BEACON
# 2. 资源包 CustomModelData：
#    type: PAPER
#    custom_model_data: 10001
# 3. CraftEngine 自定义物品（推荐）：
#    craftengine: "namespace:item_id"
# 4. ItemsAdder 自定义物品：
#    itemsadder: "namespace:item_id"
# 兼容写法：
#    plugin_item: "ce:namespace:item_id"
#    plugin_item: "ia:namespace:item_id"
#    type: "ce:namespace:item_id"
# 使用自定义物品时，type 是备用外观：对应插件未安装或找不到物品时显示 type。
# 注意：命名空间和物品ID之间必须使用英文半角冒号 ":"，不要使用中文全角冒号 "："。
#
# action：confirm 确认召唤并扣费 / cancel 返回档位选择 / close 关闭菜单 / none 无动作
# 占位符：%tier% 档位、%price% 召唤费用、%slot% 编号、%name% 假人名字
spawn_confirm:
  title: "&0召唤确认 &8· &0%name%"
  shape:
    - "#########"
    - "####I####"
    - "##C###Y##"
  items:
    I:
      type: PAPER
      name: "&e召唤信息"
      lore:
        - "&6▶ &8召唤信息"
        - "&a▸&7档位：&f%tier%"
        - "&a▸&7召唤费用：&6%price%"
        - "&a▸&7假人会出现在你所在格子的中心"
      action: "none"
    C:
      type: BARRIER
      name: "&c取消"
      lore:
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f取消并返回档位选择"
      action: "cancel"
    Y:
      type: EMERALD_BLOCK
      name: "&a确认召唤"
      lore:
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f确认召唤并按配置扣费"
      action: "confirm"
    "#":
      type: GRAY_STAINED_GLASS_PANE
      name: " "
      action: "none"
