# 配置版本号，由插件自动管理，请勿修改。插件更新后会据此自动升级本文件，自定义内容保留
config_version: 2

# 假人背包 — 指令 /afp b <编号> 打开；假人在其他子服运行时背包只能查看
#
# 布局：shape 每行 9 个字符（1–6 行），每个字符是一个格子，"." 为空格子；用到的字符在 items 中定义
# 颜色代码使用 & 符号；name 为名称，lore 为描述
#
# 菜单图标写法：
# 1. 原版物品：
#    type: BEACON
# 2. 资源包 CustomModelData：
#    type: PAPER
#    custom_model_data: 10001
# 3. CraftEngine 自定义物品（推荐）：
#    craftengine: "namespace:item_id"
# 4. ItemsAdder 自定义物品：
#    itemsadder: "namespace:item_id"
# 兼容写法：
#    plugin_item: "ce:namespace:item_id"
#    plugin_item: "ia:namespace:item_id"
#    type: "ce:namespace:item_id"
# 使用自定义物品时，type 是备用外观：对应插件未安装或找不到物品时显示 type。
# 注意：命名空间和物品ID之间必须使用英文半角冒号 ":"，不要使用中文全角冒号 "："。
#
# 以下字符对应假人的真实物品栏，数量必须正好：
#   B 主背包（27 个）   H 快捷栏（9 个，第 1 格为工作槽，第 3~9 格放挖掘样本）
#   E 装备栏（4 个，依次为头盔、胸甲、护腿、靴子）   F 副手（1 个）
# action：select:placement 设置放置方块 / open_gui:settings 打开行为设置 / close 关闭菜单
# 占位符：%name% 假人名字、%placement_block% 当前放置方块
inventory:
  title: "&0假人背包 &8· &0%name%"
  shape:
    - "BBBBBBBBB"
    - "BBBBBBBBB"
    - "BBBBBBBBB"
    - "XXXXXXXXX"
    - "FEEEE#P#S"
    - "HHHHHHHHH"
  items:
    P:
      type: BRICKS
      name: "&6&l放置方块"
      lore:
        - "&6▶ &8方块筛选"
        - "&a▸&7当前方块：&f%placement_block%"
        - "&a▸&7材料用完后暂停放置"
        - "&a▸&7树苗、种子等植物会种在正前方一格的地面上"
        - ""
        - "&6▶ &8操作"
        - "&7•&a拿着方块或植物左键&a➤&f设定放置方块（不消耗）"
        - "&7•&e鼠标右键&a➤&f清除筛选"
      action: "select:placement"
    S:
      type: COMPARATOR
      name: "&a&l行为设置"
      lore:
        - "&6▶ &8行为设置"
        - "&a▸&7管理挖掘、攻击、搬运和姿态等行为"
        - ""
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f打开行为设置"
      action: "open_gui:settings"
    X:
      type: BLACK_STAINED_GLASS_PANE
      name: " "
    "#":
      type: GRAY_STAINED_GLASS_PANE
      name: " "
  # ── 空装备栏占位图标 ─────────────────────────────────────
  # 箱子界面无法显示原版背包里的盔甲、盾牌轮廓，这里用占位图标代替：
  # 头盔、胸甲、护腿、靴子、副手为空时显示，放入物品后自动消失；拿着物品点击即可放入。
  # 图标写法同上。想要和原版一样的轮廓，可在资源包中制作对应物品，
  # 再用 craftengine / itemsadder / custom_model_data 引用。删除某一项则该格为空时不显示图标。
  empty_slots:
    helmet:
      type: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "&7头盔栏"
      lore:
        - "&a▸&7拿着头盔点击放入"
    chestplate:
      type: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "&7胸甲栏"
      lore:
        - "&a▸&7拿着胸甲或鞘翅点击放入"
    leggings:
      type: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "&7护腿栏"
      lore:
        - "&a▸&7拿着护腿点击放入"
    boots:
      type: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "&7靴子栏"
      lore:
        - "&a▸&7拿着靴子点击放入"
    offhand:
      type: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "&7副手"
      lore:
        - "&a▸&7可放入盾牌、食物等物品"
        - "&a▸&7饥饿时假人会用副手进食"
