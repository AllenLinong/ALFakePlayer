config_version: 6

# 设置购买物品 — 管理员指令 /afp items 打开
# 物品保存在数据库中，不会改写 config.yml；跨服时所有子服立即生效
#
# 布局：shape 每行 9 个字符（1–6 行），每个字符是一个格子，"." 为空格子；用到的字符在 items 中定义
# 颜色代码使用 & 符号；name 为名称，lore 为描述
#
# 菜单图标写法：
# 1. 原版物品：
#    type: BEACON
# 2. 资源包 CustomModelData：
#    type: PAPER
#    custom_model_data: 10001
# 3. CraftEngine 自定义物品（推荐）：
#    craftengine: "namespace:item_id"
# 4. ItemsAdder 自定义物品：
#    itemsadder: "namespace:item_id"
# 兼容写法：
#    plugin_item: "ce:namespace:item_id"
#    plugin_item: "ia:namespace:item_id"
#    type: "ce:namespace:item_id"
# 使用自定义物品时，type 是备用外观：对应插件未安装或找不到物品时显示 type。
# 注意：命名空间和物品ID之间必须使用英文半角冒号 ":"，不要使用中文全角冒号 "："。
#
# action：purchase_sample 物品样本格（必须正好 3 个；拿着物品左键复制，右键清空）
#         save_purchase_items 保存并关闭 / close 关闭菜单 / none 无动作
purchase_items:
  title: "&0设置购买物品 · 左键复制 / 右键清空"
  shape:
    - "#########"
    - "###AAA###"
    - "####B####"
  items:
    A:
      type: PAPER
      name: " "
      action: "purchase_sample"
    B:
      type: EMERALD
      name: "&a保存并关闭"
      lore:
        - "&6▶ &8物品价格"
        - "&a▸&7最多保存三组物品，购买时完整匹配物品数据（包括名字、lore、附魔）"
        - "&a▸&7样本槽：拿着物品左键复制，右键清空"
        - "&a▸&7保存在数据库中，所有子服立即生效"
        - ""
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f保存并关闭"
      action: "save_purchase_items"
    "#":
      type: GRAY_STAINED_GLASS_PANE
      name: " "
      action: "none"
