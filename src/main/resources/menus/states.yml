# 配置版本号，由插件自动管理，请勿修改。插件更新后会据此自动升级本文件，自定义内容保留
config_version: 2

# 公共状态文字 — 各菜单占位符使用的文字，颜色代码使用 & 符号
#   enabled / disabled   开关状态 %state%
#   summoned             在本服运行
#   summoned_remote      在其他子服运行（%server% 为子服名称）
#   not_summoned         未召唤
#   vitals_unavailable   假人不在本服运行时，主菜单 %health% 和 %food% 显示的文字
#   not_set              未设置放置方块时的 %placement_block%
#   auto_tool            %tool% 的显示文字
states:
  enabled: "&a已开启"
  disabled: "&c已关闭"
  summoned: "&a已召唤"
  summoned_remote: "&b在 %server% 运行"
  not_summoned: "&7未召唤"
  vitals_unavailable: "&7—"
  not_set: "&7未设置"
  auto_tool: "&f自动匹配"
