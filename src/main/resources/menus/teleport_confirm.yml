config_version: 5

# 召回确认 — 把已召唤的假人传到玩家身边；假人在其他子服时召回到本服（不再收费）
#
# 布局：shape 每行 9 个字符（1–6 行），每个字符是一个格子，"." 为空格子；用到的字符在 items 中定义
# 颜色代码使用 & 符号；name 为名称，lore 为描述
#
# 菜单图标写法：
# 1. 原版物品：
#    type: BEACON
# 2. 资源包 CustomModelData：
#    type: PAPER
#    custom_model_data: 10001
# 3. CraftEngine 自定义物品（推荐）：
#    craftengine: "namespace:item_id"
# 4. ItemsAdder 自定义物品：
#    itemsadder: "namespace:item_id"
# 兼容写法：
#    plugin_item: "ce:namespace:item_id"
#    plugin_item: "ia:namespace:item_id"
#    type: "ce:namespace:item_id"
# 使用自定义物品时，type 是备用外观：对应插件未安装或找不到物品时显示 type。
# 注意：命名空间和物品ID之间必须使用英文半角冒号 ":"，不要使用中文全角冒号 "："。
#
# action：confirm 确认召回 / cancel 返回主菜单 / close 关闭菜单 / none 无动作
# 占位符：%slot% 编号、%name% 假人名字
teleport_confirm:
  title: "&0召回确认 &8· &0%name%"
  shape:
    - "#########"
    - "####I####"
    - "##C###Y##"
  items:
    I:
      type: PAPER
      name: "&e召回假人"
      lore:
        - "&6▶ &8召回信息"
        - "&a▸&7把已召唤的假人传到你所在格子的中心"
        - "&a▸&7在其他子服运行时会召回到本服，不再收费"
      action: "none"
    C:
      type: BARRIER
      name: "&c取消"
      lore:
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f取消并返回假人列表"
      action: "cancel"
    Y:
      type: ENDER_PEARL
      name: "&a确认召回"
      lore:
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f确认召回"
      action: "confirm"
    "#":
      type: GRAY_STAINED_GLASS_PANE
      name: " "
      action: "none"
