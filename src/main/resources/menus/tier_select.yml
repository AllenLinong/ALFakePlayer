config_version: 6

# 选择召唤档位 — 在主菜单左键未召唤的假人时打开
#
# 布局：shape 每行 9 个字符（1–6 行），每个字符是一个格子，"." 为空格子；用到的字符在 items 中定义
# 颜色代码使用 & 符号；name 为名称，lore 为描述
#
# 菜单图标写法：
# 1. 原版物品：
#    type: BEACON
# 2. 资源包 CustomModelData：
#    type: PAPER
#    custom_model_data: 10001
# 3. CraftEngine 自定义物品（推荐）：
#    craftengine: "namespace:item_id"
# 4. ItemsAdder 自定义物品：
#    itemsadder: "namespace:item_id"
# 兼容写法：
#    plugin_item: "ce:namespace:item_id"
#    plugin_item: "ia:namespace:item_id"
#    type: "ce:namespace:item_id"
# 使用自定义物品时，type 是备用外观：对应插件未安装或找不到物品时显示 type。
# 注意：命名空间和物品ID之间必须使用英文半角冒号 ":"，不要使用中文全角冒号 "："。
#
# action：tier:normal / tier:pro / tier:promax 选择档位 / cancel 返回主菜单 / close 关闭菜单 / none 无动作
#   召唤收费（config.yml 中 economy.enabled: true 且价格大于 0）时会先打开召唤确认
# 占位符：%price% 该档位的召唤费用、%slot% 假人编号、%name% 假人名字
tier_select:
  title: "&0选择假人等级"
  shape:
    - "#########"
    - "##N#P#X##"
    - "####C####"
  items:
    N:
      type: ZOMBIE_HEAD
      name: "&a普通假人"
      lore:
        - "&6▶ &8召唤信息"
        - "&a▸&7本次召唤费用：&6%price%"
        - ""
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f召唤此档位（收费时先确认）"
      action: "tier:normal"
    P:
      type: PLAYER_HEAD
      name: "&bPro 假人"
      lore:
        - "&6▶ &8召唤信息"
        - "&a▸&7本次召唤费用：&6%price%"
        - ""
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f召唤此档位（收费时先确认）"
      action: "tier:pro"
    X:
      type: DRAGON_HEAD
      name: "&6Pro Max 假人"
      lore:
        - "&6▶ &8召唤信息"
        - "&a▸&7本次召唤费用：&6%price%"
        - ""
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f召唤此档位（收费时先确认）"
      action: "tier:promax"
    C:
      type: BARRIER
      name: "&c返回"
      lore:
        - "&6▶ &8操作"
        - "&7•&a鼠标左键&a➤&f返回假人列表"
      action: "cancel"
    "#":
      type: GRAY_STAINED_GLASS_PANE
      name: " "
      action: "none"
