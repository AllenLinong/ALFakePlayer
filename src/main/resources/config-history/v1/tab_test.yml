# 每个名字第一次用到时生成固定档案（UUID、权限组），保存在数据库里，之后一直不变；跨服时所有子服共用
# 同一个名字每次的 UUID 不变，所以皮肤也不变（皮肤见 config.yml 的 skins）
# 修改后执行 /afp reload 生效
