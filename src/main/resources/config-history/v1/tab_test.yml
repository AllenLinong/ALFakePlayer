# 权限组和比例：测试假人第一次出现时按比例抽一个组，之后固定不变；TAB 里显示这个组的前缀
# 组从这里删掉，或在 LuckPerms 里不存在了，用这个组的测试假人会按比例重新抽一个组
# 这里的组都不存在时，使用 config.yml 中 luckperms.group 的组
# 组名可以带点，例如 lv.1: 50
# 例如：
#   default: 70
#   vip: 20
#   svip: 10
groups:
  default: 100

# ── 进服和退服 ────────────────────────────────────────────
join:
  # /afp test 后陆续进入（或减少人数时陆续离开）的总时长，单位秒，在最短和最长之间随机；都填 0 则立即全部出现
  ramp_up_seconds: [60, 180]
  # 每隔多少分钟（在最短和最长之间随机）有一部分人下线、另一部分人上线，人数会小幅浮动
  churn_minutes: [5, 15]
  # 每次轮换的人数占当前人数的百分比（0–50），0 为不轮换
  churn_percent: 10
  # 是否在聊天里显示进服、退服提示，和真人进服、退服一样
  messages: true
  # 提示格式；留空使用原版的黄字“xxx 加入了游戏 / xxx 退出了游戏”（按玩家客户端的语言显示）
  # 服务器用了自定义进服提示时，改成和它一样的格式；可用 %name% 名字、%prefix% 权限组前缀，以及所有 PlaceholderAPI 变量（按这个测试假人解析）
  # 例如 "&8[&a+&8] &7%name%" 和 "&8[&c-&8] &7%name%"
  join_format: ""
  quit_format: ""
