prefix: '&8[&bALFakePlayer&8] &r'
command_help:
  # Player help: /afp help (administrators also see the admin_hint line)
  header:
    - '&8&m──────&r &b&lALFakePlayer &7Command Help &8&m──────'
    - '&8[argument] is optional; <argument> is required'
  manage:
    - '&b%command% &8- &7Open the main menu: buy, summon and manage fake players'
    - '&b%command% spawn [slot] [normal|pro|promax] &8- &7Summon; omitted tier reuses the last one'
    - '&b%command% despawn [slot] &8- &7Recall, keeping inventory and settings'
    - '&b%command% list &8- &7List your fake players and their status'
    - '&b%command% b <slot> &8- &7Open the inventory'
    - '&b%command% dir <slot> &8- &7Set the work direction from your current view'
    - '&b%command% rename <slot> <name> &8- &7Rename, using one rename card'
    - '&b%command% delete <slot> &8- &7Delete permanently, including inventory and settings'
  # Shown only with alfakeplayer.teleport
  teleport:
    - '&b%command% tp <slot> &8- &7Teleport to the fake player; sends you to its server if it runs elsewhere'
    - '&b%command% tph <slot> &8- &7Bring the fake player to you; recalls it from another server at no extra fee'
  admin_hint:
    - '&7Administrator commands: &b%command% admin help'
  # Administrator help: /afp admin help, administrators only
  admin:
    - '&8&m──────&r &b&lALFakePlayer &7Administrator Commands &8&m──────'
    - '&8[argument] is optional; <argument> is required; omit / in the console'
    - '&b%command% grant <player> <amount> &8- &7Give a player more fake players'
    - '&b%command% set <player> <total> &8- &7Top a player up to the given total'
    - '&b%command% card <player> [amount] &8- &7Give rename cards (player must be online)'
    - '&b%command% items &8- &7Set the items required to buy a fake player (in game)'
    - '&b%command% b <player> <slot> &8- &7Open any player''s fake player inventory and move items (in game)'
    - '&b%command% atp <name> &8- &7Teleport to any player''s fake player, or use <player> <slot>; works across servers, no delay or cooldown (in game)'
    - '&b%command% despawn <name> &8- &7Recall any player''s fake player, on any server'
    - '&b%command% delete <name> &8- &7Permanently delete any player''s fake player'
    - '&b%command% clear [server id|all] &8- &7Remove online fake players on this, one or all servers; saved data is kept'
    - '&b%command% servers &8- &7Show the status of each server'
    - '&b%command% reload &8- &7Reload config, menus and language files; summoned fake players here are recalled and summoned back where they were'
    - '&b%command% test <count>|stop &8- &7Let test players join the TAB list over time, or clear them'
    - '&b%command% test info|group <name> [group] &8- &7Show a test player''s profile or change its fixed group'
