        - '&7•&a鼠标左键&a➤&f开启或关闭'
      action: 'toggle:unload'
    D:
      type: COMPASS
      name: '&b&l工作方向'
      lore:
        - '&6▶ &8工作方向'
        - '&a▸&7关闭菜单后，朝目标方向挥手一次'
        - '&a▸&7只记录水平方向，设好后自动返回'
        - ''
        - '&6▶ &8操作'
        - '&7•&a鼠标左键&a➤&f开始设置'
