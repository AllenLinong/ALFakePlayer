    S:
      type: LEATHER_BOOTS
      name: '&b&l保持蹲姿'
      lore:
        - '&6▶ &8姿态设置'
        - '&a▸&7状态：%state%'
        - '&a▸&7开启后保持蹲姿，关闭后站立'
        - ''
        - '&6▶ &8操作'
        - '&7•&a鼠标左键&a➤&f开启或关闭'
      action: 'toggle:sneak'
    R:
      type: ARROW
      name: '&a&l返回背包'
      lore:
        - '&6▶ &8操作'
        - '&7•&a鼠标左键&a➤&f返回背包'
      action: 'open_gui:inventory'
