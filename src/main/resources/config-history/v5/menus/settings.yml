config-version: 5
settings:
  title: '&0行为设置 &8· &0%name%'
  shape:
    - '#########'
    - '#M#A#U#C#'
    - '##P#D#S##'
    - 'R########'
  items:
    '#':
      type: GRAY_STAINED_GLASS_PANE
      name: ' '
    M:
      type: IRON_PICKAXE
      name: '&e&l挖掘'
      lore:
        - '&6▶ &8挖掘设置'
        - '&a▸&7状态：%state%'
        - '&a▸&7只挖正前方一列，先尝试上格，再尝试下格'
        - '&a▸&7快捷栏有方块时，只挖同类方块'
        - '&a▸&7自动选择符合采集等级的工具'
        - ''
        - '&6▶ &8操作'
        - '&7•&a鼠标左键&a➤&f开启或关闭'
      action: 'toggle:mine'
    A:
      type: IRON_SWORD
      name: '&c&l攻击'
      lore:
        - '&6▶ &8攻击设置'
        - '&a▸&7状态：%state%'
        - '&a▸&7攻击间隔：&f%attack_interval% tick &8（默认和最短 20）'
        - '&a▸&7范围内有目标则攻击，没目标也会挥手'
        - ''
        - '&6▶ &8操作'
        - '&7•&a鼠标左键&a➤&f开启或关闭'
        - '&7•&e鼠标右键&a➤&f输入攻击间隔'
        - '&7•&bShift+左键&a➤&f减少 20 tick'
        - '&7•&bShift+右键&a➤&f增加 20 tick'
      action: 'toggle:attack'
    U:
      type: GRASS_BLOCK
      name: '&a&l放置'
      lore:
        - '&6▶ &8放置设置'
        - '&a▸&7状态：%state%'
        - '&a▸&7当前方块：&f%placement_block%'
        - '&a▸&7在背包第五行设定放置方块'
        - ''
        - '&6▶ &8操作'
        - '&7•&a鼠标左键&a➤&f开启或关闭'
      action: 'toggle:use'
    C:
      type: CHEST
      name: '&6&l搬运货物'
      lore:
        - '&6▶ &8搬运设置'
        - '&a▸&7状态：%state%'
        - '&a▸&7把主背包货物搬到相邻箱子'
        - '&a▸&7保留快捷栏、副手和装备'
        - ''
