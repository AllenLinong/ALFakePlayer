config-version: 2
language: zh_CN

slots:
  default: 1
  max-per-owner: 10
  max-active-server: 20

luckperms:
  group: 'default'

economy:
  enabled: false
  summon-price: 100.0
  tier-prices:
    normal: 100.0
    pro: 250.0
    promax: 500.0

teleport:
  to-dummy-delay-seconds: 5
  to-dummy-cooldown-seconds: 5

performance:
  simulation-distance: 2
  view-distance: 4
  dummy-chunks:
    normal: 5
    pro: 7
    promax: 10
  idle-target-interval-ticks: 3
  idle-target-max-ticks: 20
  use-interval-ticks: 4
  save-interval-ticks: 200

unloading:
  enabled: true
  interval-ticks: 40
  max-retry-ticks: 160

survival:
  ignore-hostile-mobs: true
  auto-eat-at-food-level: 2
  minimum-tool-durability: 1
  passive-exhaustion-per-second: 0.1
  lethal-starvation-any-non-peaceful-difficulty: true
