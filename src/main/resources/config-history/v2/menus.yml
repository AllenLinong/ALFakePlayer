config-version: 2
states:
  enabled: '&a已开启'
  disabled: '&c已关闭'
  summoned: '&a已召唤'
  not-summoned: '&7未召唤'
main:
  title: '&0我的假人 &8· &0第 %page% 页'
  shape:
    - '####T####'
    - '#AAAAAAA#'
    - 'N###X#G#P'
  items:
    '#':
      type: GRAY_STAINED_GLASS_PANE
      name: ' '
      action: 'none'
    T:
      type: BOOK
      name: '&b&l我的假人'
      lore:
        - '&7左键召唤或召回，需确认'
        - '&7右键传送到假人位置'
        - '&7Shift+右键打开假人背包'
      action: 'none'
    A:
      type: PLAYER_HEAD
      name: '&e%name% &8(#%slot%)'
      lore:
        - '&7等级: &f%tier%'
        - '&7状态: %status%'
        - ''
        - '&a左键 &7召唤/召回（需确认）'
        - '&b右键 &7传送到假人身边'
        - '&dShift+右键 &7打开背包'
      action: 'dummy'
    N:
      type: ARROW
      name: '&e上一页'
      lore: []
      action: 'page:previous'
    X:
      type: PAPER
      name: '&7第 %page% 页'
      lore:
        - '&7切换下方的假人列表'
      action: 'none'
    G:
      type: CHEST
      name: '&a&l新增假人'
      lore:
        - '&7使用空闲栏位创建假人'
        - '&7可在下一步选择假人等级'
      action: 'new_dummy'
    P:
      type: ARROW
      name: '&e下一页'
      lore: []
      action: 'page:next'
tier-select:
  title: '&0选择假人等级'
  shape:
    - '#########'
    - '###N#####'
    - '##P#X#C##'
  items:
    '#':
      type: GRAY_STAINED_GLASS_PANE
      name: ' '
      action: 'none'
    N:
      type: ZOMBIE_HEAD
      name: '&a普通假人'
      lore:
        - '&7选择后还会显示费用并再次确认'
      action: 'tier:normal'
    P:
      type: PLAYER_HEAD
      name: '&bPro 假人'
      lore:
        - '&7选择后还会显示费用并再次确认'
      action: 'tier:pro'
    X:
      type: DRAGON_HEAD
      name: '&6Pro Max 假人'
      lore:
        - '&7选择后还会显示费用并再次确认'
      action: 'tier:promax'
    C:
      type: BARRIER
      name: '&c取消'
      lore: []
      action: 'cancel'
spawn-confirm:
  title: '&0召唤确认 &8· &0%name%'
  shape:
    - '#########'
    - '###I#####'
    - '##C###Y##'
  items:
    '#':
      type: GRAY_STAINED_GLASS_PANE
      name: ' '
      action: 'none'
    I:
      type: PAPER
      name: '&e召唤信息'
      lore:
        - '&7等级: &f%tier%'
        - '&7费用: &6%price%'
        - '&7召唤在你当前位置；经济关闭时不收费。'
      action: 'none'
    C:
      type: BARRIER
      name: '&c取消'
      lore: []
      action: 'cancel'
    Y:
      type: EMERALD_BLOCK
      name: '&a确认召唤'
      lore:
        - '&7确认后开始召唤并按配置扣费'
      action: 'confirm'
teleport-confirm:
  title: '&0召回确认 &8· &0%name%'
  shape:
    - '#########'
    - '###I#####'
    - '##C###Y##'
  items:
    '#':
      type: GRAY_STAINED_GLASS_PANE
      name: ' '
      action: 'none'
    I:
      type: PAPER
      name: '&e召回假人'
      lore:
        - '&7确认后会把已召唤的假人传送到你的位置。'
      action: 'none'
    C:
      type: BARRIER
      name: '&c取消'
      lore: []
      action: 'cancel'
    Y:
      type: ENDER_PEARL
      name: '&a确认召回'
      lore: []
      action: 'confirm'
inventory:
  title: '&0假人背包 &8· &0%name%'
  shape:
    - 'BBBBBBBBB'
    - 'BBBBBBBBB'
    - 'BBBBBBBBB'
    - 'XXXXXXXXX'
    - 'FEEEE#P#S'
    - 'HHHHHHHHH'
  items:
    X:
      type: BLACK_STAINED_GLASS_PANE
      name: ' '
    '#':
      type: GRAY_STAINED_GLASS_PANE
      name: ' '
    P:
      type: BRICKS
      name: '&6&l放置方块'
      lore:
        - '&6▶ &8方块筛选'
        - '&6▸ &7当前方块: &f%placement_block%'
        - '&6▸ &7缺货时暂停，不使用其他方块'
        - ''
        - '&6▶ &8操作'
        - '&7• &a拿着方块左键 &a➤ &f设定方块（不消耗）'
        - '&7• &a鼠标右键 &a➤ &f清除筛选'
      action: 'select:placement'
    S:
      type: COMPARATOR
      name: '&a&l行为设置'
      lore:
        - '&6▶ &8行为管理'
        - '&a▸ &7管理挖掘、攻击与放置'
        - ''
        - '&6▶ &8操作'
        - '&7• &a鼠标左键 &a➤ &f打开行为设置'
      action: 'open_gui:settings'

settings:
  title: '&0行为设置 &8· &0%name%'
  shape:
    - '#########'
    - '#M#A#U#C#'
    - '####D####'
    - 'R########'
  items:
    '#':
      type: GRAY_STAINED_GLASS_PANE
      name: ' '
    M:
      type: IRON_PICKAXE
      name: '&e&l挖掘'
      lore:
        - '&6▶ &8挖掘设置'
        - '&e▸ &7当前状态: %state%'
        - '&e▸ &7先挖正前方上格，再挖它正下方一格'
        - '&e▸ &7快捷栏有方块时，只挖同类方块'
        - '&e▸ &7自动匹配工具和采集等级，不匹配就暂停'
        - ''
        - '&6▶ &8操作'
        - '&7• &a鼠标左键 &a➤ &f开启或关闭'
      action: 'toggle:mine'
    A:
      type: IRON_SWORD
      name: '&c&l攻击'
      lore:
        - '&6▶ &8攻击设置'
        - '&c▸ &7当前状态: %state%'
        - '&c▸ &7攻击间隔: &f%attack_interval% tick &8（默认/最短 20）'
        - '&c▸ &7武器冷却结束后攻击前方目标'
        - ''
        - '&6▶ &8操作'
        - '&7• &a鼠标左键 &a➤ &f开启或关闭'
        - '&7• &a鼠标右键 &a➤ &f输入攻击间隔'
        - '&7• &aShift+左键/-20，Shift+右键/+20 tick'
      action: 'toggle:attack'
    U:
      type: GRASS_BLOCK
      name: '&a&l放置'
      lore:
        - '&6▶ &8放置设置'
        - '&a▸ &7当前状态: %state%'
        - '&a▸ &7当前方块: &f%placement_block%'
        - '&a▸ &7请在背包第 5 行设定放置方块'
        - ''
        - '&6▶ &8操作'
        - '&7• &a鼠标左键 &a➤ &f开启或关闭'
      action: 'toggle:use'
    C:
      type: CHEST
      name: '&6&l搬运货物'
      lore:
        - '&7当前状态: %state%'
        - '&7主背包满时，将物品搬到相邻箱子'
        - '&7保留快捷栏、副手和装备'
        - '&a左键 &7开启或关闭'
      action: 'toggle:unload'
    D:
      type: COMPASS
      name: '&b&l工作方向'
      lore:
        - '&a左键 &7关闭菜单，然后朝目标方向挥手一次'
        - '&7只记录水平方向，设好后自动返回'
      action: 'direction'
    R:
      type: ARROW
      name: '&a&l返回背包'
      lore:
        - '&6▶ &8操作'
        - '&7• &a鼠标左键 &a➤ &f返回背包'
      action: 'open_gui:inventory'
