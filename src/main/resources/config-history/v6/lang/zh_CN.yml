config-version: 6
despawn-help: '&e???/afp despawn [??]'
despawn-offline: '&7????????'
despawn-done: '&a??? %name%??????????'
attack-interval-input: '&e当前 %ticks% tick。请在聊天输入 20–200 的整数，或输入 cancel 取消。'
attack-interval-invalid: '&c请输入 20–200 的整数。'
attack-interval-set: '&a攻击间隔已设为 %ticks% tick。'
direction-capture: '&e朝目标方向对空气左键挥手一次。'
no-empty-slot: '&c没有可用的假人栏位。'
prefix: '&8[&bALFakePlayer&8] &r'
command-help:
  header:
    - '&8&m──────&r &b&lALFakePlayer &7指令帮助 &8&m──────'
    - '&8[参数] 可省略，<参数> 必填'
  manage:
    - '&6▶ &f假人管理 &8（游戏内）'
    - '&b%command% despawn [??] &8- &7????????????'
    - '&b%command% spawn [编号] [normal|pro|promax] &8- &7按等级召唤；不指定等级时沿用上次等级'
    - '&b%command% spawnpro [编号] / spawnpromax [编号] &8- &7直接召唤 Pro / Pro Max'
    - '&b%command% <编号> &8- &7打开背包；也可用 open <编号>'
    - '&b%command% list &8- &7查看栏位和在线状态'
    - '&b%command% direction <编号> &8- &7更新工作朝向；缩写 dir'
    - '&b%command% rename <编号> <新名字> &8- &7消耗一张黑奴改名卡'
    - '&b%command% delete <编号或名字> &8- &7永久删除自己的假人；也可用 kill'
  teleport:
    - '&6▶ &f传送 &8（游戏内）'
    - '&b%command% tp <编号> &8- &7传送到假人的当前位置；也可用 teleport'
    - '&b%command% tph <编号> &8- &7把假人传到你的当前位置；也可用 bring'
  tiers:
    - '&6▶ &f假人等级与区块范围'
    - '&7普通 Normal：&f5×5 &8| &7高级 Pro：&f7×7 &8| &7超高级 Pro Max：&f最多 9×9'
    - '&7区块范围和召唤价格可在 config.yml 的 performance.dummy-chunks 与 economy.tier-prices 设置。'
  admin:
    - '&6▶ &f管理员 &8（游戏内或后台）'
    - '&b%command% grant <玩家或UUID> <数量> &8- &7增加栏位'
    - '&b%command% givecard <在线玩家> [数量] &8- &7发放黑奴改名卡'
    - '&b%command% setslots <玩家或UUID> <总数> &8- &7设置栏位总数'
    - '&b%command% kill <假人名字> &8- &7按名字永久删除任意假人；也可用 delete'
    - '&b%command% deleteall confirm &8- &7清除已召唤的假人，保留存档'
no-permission: '&c你没有权限。'
