config-version: 6
despawn-help: '&eUsage: /afp despawn [slot]'
despawn-offline: '&7This dummy is not summoned.'
despawn-done: '&aRecalled %name%. Its inventory and settings were kept.'
attack-interval-input: '&eCurrent: %ticks% ticks. Enter an integer from 20 to 200 in chat, or type cancel.'
attack-interval-invalid: '&cEnter an integer from 20 to 200.'
attack-interval-set: '&aAttack interval set to %ticks% ticks.'
direction-capture: '&eFace the desired direction and left-click the air once.'
no-empty-slot: '&cNo fake player slots are available.'
prefix: '&8[&bALFakePlayer&8] &r'
command-help:
  header:
    - '&8&m──────&r &b&lALFakePlayer &7Command Help &8&m──────'
    - '&8[argument] is optional; <argument> is required'
  manage:
    - '&6▶ &fManage fake players &8(in game)'
    - '&b%command% despawn [slot] &8- &7Recall a dummy without deleting its inventory or settings'
    - '&b%command% spawn [slot] [normal|pro|promax] &8- &7Choose a tier; omitted tier reuses the last one'
    - '&b%command% spawnpro [slot] / spawnpromax [slot] &8- &7Summon Pro / Pro Max directly'
    - '&b%command% <slot> &8- &7Open inventory; also open <slot>'
    - '&b%command% list &8- &7List your slots and online status'
    - '&b%command% direction <slot> &8- &7Set work direction; alias: dir'
    - '&b%command% rename <slot> <new name> &8- &7Use one Fake Player Rename Card'
    - '&b%command% delete <slot or name> &8- &7Permanently delete your fake player; alias: kill'
  teleport:
    - '&6▶ &fTeleport &8(in game)'
    - '&b%command% tp <slot> &8- &7Teleport to the fake player''s exact position; alias: teleport'
    - '&b%command% tph <slot> &8- &7Bring the fake player to your exact position; alias: bring'
  tiers:
    - '&6▶ &fFake player tiers and chunk ranges'
    - '&7Normal: &f5x5 &8| &7Pro: &f7x7 &8| &7Pro Max: &fup to 9x9'
    - '&7Configure chunk ranges and prices in performance.dummy-chunks and economy.tier-prices.'
  admin:
    - '&6▶ &fAdministration &8(in game or console)'
    - '&b%command% grant <player or UUID> <amount> &8- &7Grant extra slots'
    - '&b%command% givecard <online player> [amount] &8- &7Give rename cards'
    - '&b%command% setslots <player or UUID> <total> &8- &7Set total slots'
    - '&b%command% kill <name> &8- &7Permanently delete any fake player by name; alias: delete'
    - '&b%command% deleteall confirm &8- &7Remove summoned fake players without deleting saved data'
no-permission: '&cYou do not have permission.'
player-only: '&cOnly players can run this command.'
already-live: '&eThis fake player is online or is being summoned.'
server-limit: '&cThe server has reached its online fake player limit.'
spawn-failed: '&cSummoning failed. Ask an administrator to check the logs.'
spawn-help: '&eUsage: /afp spawn [slot] [normal|pro|promax], /afp spawnpro [slot], or /afp spawnpromax [slot]'
spawned: '&aSummoned %tier% fake player #%slot%: %name% (chunk range %chunks%x%chunks%)'
tier-name:
  normal: Normal
  pro: Pro
  promax: Pro Max
not-owner: '&cOnly the owner can manage this fake player.'
bad-name: '&cInvalid or duplicate name. Use 1–32 characters and avoid numbers-only or reserved names.'
renamed: '&aRenamed the fake player to %name%.'
rename-help: '&eUsage: /afp rename <slot> <new name>'
rename-card-required: '&eYou need a Fake Player Rename Card in your inventory, hotbar, or offhand.'
rename-card:
  name: '&6&lFake Player Rename Card'
  lore:
    - '&7Renames one of your fake players.'
    - '&e/afp rename <slot> <new name>'
    - '&8Consumes one card on success.'
givecard-help: '&eUsage: /afp givecard <online player> [amount 1–64]'
givecard-offline: '&cThe target must be a real player who is online.'
givecard-done: '&aGave %amount% rename card(s) to %player%.'
givecard-full: '&eInventory space is limited; %amount% card(s) were not given.'
rename-not-found: '&cYou do not have a fake player in that slot.'
grant-help: '&eUsage: afp grant <player or UUID> <amount> or afp setslots <player or UUID> <total>'
granted: '&a%name% now has %slots% fake player slots.'
slots-in-use: '&cDelete fake players in slots above the new limit first.'
deleteall-help: '&eOnly summoned fake players are removed. Slots, inventories, and settings are kept. Confirm with afp deleteall confirm.'
delete-help: '&eUsage: afp delete <slot or name>. This also deletes the inventory and settings.'
deleted: '&aDeleted fake player: %name%'
despawn-all-queued: '&aScheduled removal of %count% summoned fake players. Saved data is kept.'
not-found: '&cFake player not found. The console must delete by name.'
locked: '&cYou can use slots 1–%slots%.'
slots: '&7Unlocked slots: &f%slots%'
list-live: '&a#%slot% &f%name% &7Online'
list-offline: '&8#%slot% &f%name% &7Not summoned'
wrong-equipment: '&cThat item does not fit in this equipment slot.'
placement-sample: '&ePick up the block with your cursor and left-click the placement filter.'
remote-inventory: '&eThis fake player is in another region. You can view its inventory; move closer to transfer items.'
direction-set: '&aUpdated the work direction for fake player #%slot%.'
direction-offline: '&cSummon this fake player before setting its work direction.'
teleport-help: '&eUsage: /afp tp <slot>'
bring-help: '&eUsage: /afp tph <slot> or /afp bring <slot>'
bring-done: '&aFake player #%slot% has been teleported to your position.'
teleport-offline: '&cYou can only teleport to or bring your own online fake players.'
teleport-pending: '&eTeleport in progress. Please wait.'
teleport-cooldown: '&eWait %seconds% seconds before teleporting again.'
teleport-wait: '&eTeleporting to the fake player''s position in %seconds% seconds.'
teleport-done: '&aTeleported to the position of fake player #%slot%.'
teleport-failed: '&cTeleport failed.'
economy-unavailable: '&cThe economy service is unavailable. The fake player was not summoned.'
economy-declined: '&cSummoning costs %price% coins. The payment did not go through.'
economy-paid: '&7Summoning cost: &e%price% &7coins.'
economy-refunded: '&7Refunded &e%price% &7coins.'
economy-refund-failed: '&cRefund failed. Contact an administrator for a refund of %price% coins.'
