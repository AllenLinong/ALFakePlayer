states:
  enabled: '&a已开启'
  disabled: '&c已关闭'
tools:
  PICKAXE: '&e镐子'
  AXE: '&e斧头'
  SHOVEL: '&e铲子'

inventory:
  title: '&0假人背包 &8· &0%name%'
  shape:
    - 'BBBBBBBBB'
    - 'BBBBBBBBB'
    - 'BBBBBBBBB'
    - 'HHHHHHHHH'
    - 'EEEE#F###'
    - 'M###I###S'
  items:
    '#':
      type: GRAY_STAINED_GLASS_PANE
      name: ' '
    M:
      type: IRON_SWORD
      name: '&e主手说明'
      lore:
        - '&7第 4 行是快捷栏'
        - '&f最左侧的第 1 格始终是主手'
    I:
      type: CHEST
      name: '&e栏位说明'
      lore:
        - '&7前 3 行：背包'
        - '&7第 5 行从左到右：头盔、胸甲、护腿、靴子'
        - '&7第 5 行第 6 格：副手'
        - '&f左键移动或交换，右键拆分或放入 1 个'
    S:
      type: COMPARATOR
      name: '&a行为设置'
      lore:
        - '&7管理挖掘、攻击与右键使用'
        - '&f点击打开'
      action: 'open_gui:settings'

settings:
  title: '&0行为设置 &8· &0%name%'
  shape:
    - '#########'
    - '##M#A#U##'
    - 'R########'
  items:
    '#':
      type: GRAY_STAINED_GLASS_PANE
      name: ' '
    M:
      type: IRON_PICKAXE
      name: '&e挖掘'
      lore:
        - '&7挖掘准星对准的方块'
        - '&7状态：%state%'
        - '&7匹配工具：%tool%'
        - '&f左键开关｜右键切换工具'
      action: 'toggle:mine'
    A:
      type: IRON_SWORD
      name: '&c攻击'
      lore:
        - '&7武器冷却结束后攻击前方目标'
        - '&7状态：%state%'
        - '&f点击切换'
      action: 'toggle:attack'
    U:
      type: GRASS_BLOCK
      name: '&a放置 / 使用'
      lore:
        - '&7按间隔执行右键，可放置方块或使用物品'
        - '&7状态：%state%'
        - '&f点击切换'
      action: 'toggle:use'
    R:
      type: ARROW
      name: '&a返回背包'
      lore:
        - '&f点击返回'
      action: 'open_gui:inventory'
