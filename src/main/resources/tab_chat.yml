# ── AI ────────────────────────────────────────────────────
# 开启后，回复真人和冷场闲聊交给 AI 决定谁说、说什么；欢迎、进服打招呼、下线道别仍用上面的语料
# AI 的回复同样进队列，受 limits 限制；超时、出错或用完次数时自动改用上面的规则和语料
# 注意：开启后，真人的聊天内容和最近的聊天记录会发给你填写的 AI 服务商
ai:
  enabled: false
  # 接口格式：openai（OpenAI 格式的 /chat/completions，DeepSeek、通义千问、Kimi、智谱、豆包、OpenAI、各种中转站、本地 Ollama 等都是这个格式）
  #           anthropic（Claude 的 /v1/messages，base_url 填 https://api.anthropic.com）
  format: openai
  # 接口地址，会自动补全路径，例如：
  #   DeepSeek   https://api.deepseek.com
  #   通义千问   https://dashscope.aliyuncs.com/compatible-mode/v1
  #   Kimi       https://api.moonshot.cn/v1
  #   本地 Ollama http://127.0.0.1:11434/v1
  base_url: "https://api.deepseek.com"
  # API Key；本地模型不需要可以留空
  api_key: ""
  # 模型名。DeepSeek 用 deepseek-chat（便宜、快），不要用推理模型 deepseek-reasoner（慢）
  model: "deepseek-chat"
  # 随机程度，越大说话越多样；anthropic 格式不发送这一项
  temperature: 1.3
  # 每次回复最多多少 token；回复被截断时会自动加大一次再试
  max_tokens: 400
  # 等待回复的秒数，超时改用规则和语料
  timeout_seconds: 15
  # 每分钟、每天最多调用几次，防止费用失控；用完后改用规则和语料
  max_calls_per_minute: 6
  daily_call_limit: 1500
  # 要求接口返回 JSON。接口不支持时会自动去掉再试，并在本次运行中不再发送
  json_mode: true
  # 发给 AI 的最近聊天条数
  history_lines: 15
  # 一次最多让几个测试假人说话（回复真人时最多 2 句，冷场闲聊最多这么多句）
  max_lines: 4
  # 服务器介绍：玩法、常用指令等，AI 只会提这里写到的指令，不会乱编
  server_info: |
    这是一个 Minecraft 生存服务器，大家一起挖矿、建房子、打怪。
  # 测试假人的性格，按 UUID 固定分配，AI 会按性格说话
  personas:
    - 话少，回复很短，常用“嗯”“哈哈”“6”
    - 新手，爱问问题，语气客气
    - 老玩家，懂得多，回答简短直接
    - 爱开玩笑，常说“笑死”“绷不住了”
    - 学生，偶尔提作业和考试，喜欢用 qwq、awa
    - 建筑党，爱聊盖房子和装修
    - 红石党，爱聊机器、刷怪塔、自动农场
    - 佛系玩家，喜欢钓鱼种地，说话慢悠悠
