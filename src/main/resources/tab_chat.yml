# 配置版本号，由插件自动管理，请勿修改。插件更新后会据此自动升级本文件，自定义内容保留
config_version: 1

# ============================================================
# TAB 测试假人的聊天（/afp test）
# ============================================================
# 测试假人会像真人一样在聊天区说话：回复真人、欢迎进服的人、进服打招呼、下线道别、冷场时互相闲聊
# 所有测试假人的发言都进同一个队列，一句一句发出，受下面 limits 的限制，不会几个人同时说话
# 不开 AI 时用本文件的关键词规则和语料；开启 ai 后，回复真人和冷场闲聊由 AI 决定谁说、说什么
# 只有真人在线时才会说话；测试假人之间不会因为对方的话互相触发，它们之间的对话只在冷场闲聊时发生
# 修改后执行 /afp reload 生效
# ============================================================

# 总开关
enabled: true

# ── 接入聊天插件 ──────────────────────────────────────────
# 测试假人的话怎么发出去：
#   chat：和真人一样走服务器的聊天流程，由聊天插件（TrChat、ChatControl、EssentialsChat、CarbonChat 等）排版、
#         分频道、跨服转发、同步到 Discord/QQ 等，看起来和真人发言完全一样；没有聊天插件时就是原版的 <名字> 内容
#         聊天插件按 LuckPerms 读前缀：测试假人第一次说话时，会在 LuckPerms 里建一个用户并加入它的权限组
#   format：按下面的 format 直接发给每个真人，不经过聊天插件
#   auto：装了常见聊天插件时用 chat，否则用 format
# chat 方式下消息被别的插件（登录、禁言插件等）拦下时，这一句改用 format 发出；出现报错时，到下次 /afp reload 前都改用 format
send_mode: auto

# format 方式的格式，要和服务器给真人用的聊天格式一致，否则一眼就能看出来；跨服时本插件补发其他子服测试假人的话也用这个格式
# 可用 %prefix% 权限组前缀、%name% 名字、%message% 内容；支持 & 颜色代码和 &#RRGGBB 十六进制颜色。原版格式是 "<%name%> %message%"
# 装了 PlaceholderAPI 时，任何插件的变量都能用，按这个测试假人解析，和真人一样，例如 %luckperms_prefix%、%luckperms_suffix%、
# %vault_prefix%、%player_world%。用到变量时，测试假人说话前会在 LuckPerms 里建一个用户并加入它的权限组（同 chat 方式）
format: "<%name%> %message%"

# 真人的消息被聊天事件取消后还要不要听：TrChat 这类聊天插件会取消原版聊天、自己重新发送，不听就收不到真人的消息
#   auto：装了这类聊天插件时听，否则不听（被禁言的人的消息不会触发回复）
#   true / false：总是听 / 总是不听
include_cancelled_chat: auto

# ── 跨服 ──────────────────────────────────────────────────
# database.yml 用 mysql（跨服）时，全网的测试假人和真人在同一个聊天里：
#   - 任何子服的真人说话、进服，测试假人都会回应；从别的子服换过来的不算进服，不欢迎
#   - 测试假人在哪个子服的 TAB 里，话就从哪个子服说出来，所有子服都能看到
#   - 有测试假人、开了 enabled 的子服中 server_id 排序最前的那个负责安排谁说、说什么，用它的本文件和 AI 设置，
#     限流按全网的真人数计算；各子服的本文件最好保持一致。/afp test chat 可以看到是哪个子服
#   - enabled: false 的子服不参与：它的测试假人不说话，它的真人看不到测试假人的话，说话也不会引起回应
cross_server:
  # 各子服的聊天本来不互通（没装跨服聊天插件，真人看不到别的子服的人说话）时改成 false，
  # 这样测试假人也只在自己的子服里聊天，只回应本服的真人，和真人一样
  enabled: true
  # 测试假人在别的子服说的话，聊天插件会不会转发到本服：
  #   auto：自动判断，适用于所有聊天插件。等一会儿（1.5 秒起），没看到聊天插件转发来的这句话，才由本插件按 format 显示；
  #         补发后又收到转发来的，说明聊天插件转发得慢，之后自动多等一会儿（最多 6 秒）
  #   true：一定会转发，本插件不补发。自动判断仍出现重复时用（例如聊天插件改了测试假人的名字或内容）
  #   false：不会转发，本插件立即按 format 显示
  # 那句话没走聊天流程时（send_mode 为 format，或被拦下改用 format），聊天插件不会转发，总是由本插件显示
  forwarded: auto

# ── 限流（自适应） ────────────────────────────────────────
# 每 window_seconds 秒内，所有测试假人合计能说的句数会随情况变化：
#   - 平时：base_messages 句，每多一个在线真人多 messages_per_player 句
#   - 真人聊得多时：测试假人的发言最多占这段时间全部聊天的 max_share_percent%，真人说得越多，测试假人可以说得越多
#   - 无论如何不超过 max_messages 句
#   - 冷场闲聊最多用一半的名额，给回复真人留出余地；被 @ 的回复总多留一个名额
#   - 真人之间正在聊天时（dont_interrupt），测试假人不闲聊、不接别人的话，关键词回复的概率减半；被 @ 时照常回复
#   - 聊天区热闹时，句间间隔自动缩短到 1/2～3/4；在线真人越多，冷场开话题的等待越短
# 觉得测试假人话太少时，先调大 base_messages、messages_per_player 和 talkative_percent，调小 gap_seconds 和 speaker_cooldown_seconds
limits:
  window_seconds: 60
  base_messages: 5
  messages_per_player: 1
  max_share_percent: 40
  max_messages: 15
  dont_interrupt: true
  # 任意两句之间至少隔多少秒（在最短和最长之间随机），平时不会同时说话；一窝蜂（见下面 burst）不受这个限制
  gap_seconds: [4, 10]
  # 同一个测试假人说完后，多少秒内不主动开口；被 @、正在和真人对话、在闲聊对话中接话、一窝蜂时不受限制
  speaker_cooldown_seconds: 90
  # 同一条关键词规则多少秒内只回一次（10 个人说“你好”只回一次）；规则里可以单独设 cooldown_seconds
  rule_cooldown_seconds: 30
  # 打字时间：基础秒数 + 每个字的秒数 + 0 到随机秒数，打完字才发出
  typing_base_seconds: 2
  typing_per_char_seconds: 0.3
  typing_random_seconds: 3
  # 打完字后排队超过多少秒还没轮到就作废，过时的回复显得假
  expire_seconds: 20
  # 一窝蜂：按概率几个测试假人几乎同时说话，像真人群聊一样。会发生在：
  #   - 关键词回复（例如有人问“有人吗”，几个人一起回“在”“有”“咋了”）
  #   - 真人进服时几个人一起欢迎；测试假人进服打招呼、下线道别时几个人一起回应
  #   - 冷场对话（dialogues）几个人你一句我一句很快说完；开了 AI 时 AI 给的几句也一样
  # 一窝蜂里每人说不同的话，第一句照常受上面的限流，后面几句紧跟着发出，不等 gap_seconds、不看冷却，但计入句数
  # 被 @ 的回复、真人之间正在聊天时（dont_interrupt）不会一窝蜂
  burst:
    # 概率（0–100），0 为关闭
    chance: 25
    # 一共几个人说话
    speakers: [3, 4]
    # 相邻两句之间隔多少秒，可以带小数；打字时间也只算一半
    gap_seconds: [0.3, 2]

# 会说话的测试假人占多少百分比（0–100）。其余的只挂在 TAB 里，被 @ 时才回
# 由 UUID 决定，同一个人一直是“话多”或“潜水”
talkative_percent: 50

# 真人和某个测试假人说过话后，多少秒内优先由这个测试假人接着聊
conversation_seconds: 60

# ── 冷场闲聊 ──────────────────────────────────────────────
idle:
  # 聊天区安静多少秒后（在最短和最长之间随机），由测试假人开个话题
  quiet_seconds: [40, 120]
  # 开话题时，多少百分比是几个测试假人之间的对话（dialogues），其余是一个人说一句（lines.idle）
  dialogue_percent: 60

# ── 触发概率（百分比 0–100） ───────────────────────────────
chances:
  # 真人进服时有人欢迎
  welcome: 40
  # 两次欢迎至少隔多少秒
  welcome_cooldown_seconds: 120
  # 测试假人自己进服时打个招呼
  join_greet: 15
  # 测试假人下线前说一声
  farewell: 20
  # 有人打招呼或说再见时，另一个测试假人回应
  answer: 50
  # 被 @ 或叫到名字时回复
  mention: 90
  # 正在对话的测试假人接真人的话；测试假人刚问完问题，真人回了一句时，提问的人接话
  follow_up: 45
  # 真人问了问题但没有规则匹配时，有人回一句“不知道”之类
  question: 25

# 消息里有这些词时不回复（不和真人争论自己是不是机器人）
# 本文件里的英文和数字关键词按整词匹配（hi 不会匹配 this），中文按包含匹配
ignore_keywords: [机器人, 假人, 人机, 脚本, 托, 挂机号, bot, ai]

# ── 关键词回复 ────────────────────────────────────────────
# 真人的消息里出现 keywords 中的任意一个（不区分大小写）就按 chance 的概率回复，从上往下匹配第一条
# responders：由几个人回复（在最少和最多之间随机）；lines 里可用 %player% 说话的真人
replies:
  - keywords: [有人吗, 有人没, 有没有人, 人呢, 在吗, 有活人吗]
    chance: 85
    responders: [1, 2]
    lines: [在的, 有, 我在, 在, 在呢, 有人, 咋了, 怎么了, 有有有, 在 怎么了, 有人 咋了, 来了来了]
  - keywords: [大家好, 你好, 你们好, hello, 哈喽, 嗨, hi]
    chance: 80
    responders: [1, 2]
    lines: [你好呀, hi~, 哈喽, 你好, hello, 嗨嗨, "你好 %player%", "hi %player%", 嗨, 你好你好, "哈喽 %player%"]
  - keywords: [早上好, 早安, 早啊, 早呀]
    chance: 75
    responders: [1, 2]
    lines: [早, 早啊, 早上好~, 这么早, 早早早, "早 %player%", 早安]
  - keywords: [中午好, 午安]
    chance: 60
    lines: [中午好, 中午好~ 吃了没, 午安]
  - keywords: [晚上好]
    chance: 70
    responders: [1, 2]
    lines: [晚上好, 晚上好呀, "晚上好 %player%", 晚好]
  - keywords: [晚安, 睡了, 睡觉了, 去睡了]
    chance: 70
    responders: [1, 2]
    lines: [晚安~, "晚安 %player%", 88 晚安, 好梦, 这么早就睡啊, 晚安晚安, 晚安 明天见]
  - keywords: [拜拜, "88", 先下了, 下线了, 溜了, 我下了, 明天见]
    chance: 65
    responders: [1, 2]
    lines: ["88", 拜拜, bye, 慢走, 明天见, "88 %player%", 拜~]
  - keywords: [谢谢, 谢了, 感谢, 多谢, thx, 3q]
    chance: 70
    lines: [不客气, 没事, 小事, 客气啥, 不用谢, 没事没事]
  - keywords: [新人, 萌新, 第一次来, 刚来, 新来的]
    chance: 75
    responders: [1, 2]
    lines: [欢迎欢迎, 欢迎~, 新人好, 有不懂的可以问, "欢迎 %player%", 欢迎来玩, 我也来没多久 哈哈]
  - keywords: [卡, 延迟, 掉线, lag, 好卡, 卡死]
    chance: 55
    lines: [我也有点卡, 还好吧 我不卡, 是有点, 刚才卡了一下, 可能是你网不好, 我这挺流畅的, 刚才我也掉了]
  - keywords: [哈哈, 笑死, hhh, "233", 绷不住, 乐死]
    chance: 30
    lines: [哈哈哈, 笑死, hhhh, 哈哈哈哈哈, 绷不住了, 哈哈, 乐]
  - keywords: [钻石, 下界合金, 合金, 鞘翅, 附魔金苹果, 神装, 满级]
    chance: 50
    lines: [牛, 羡慕, 好家伙, 欧皇, 分我点, 我怎么挖不到, "6", 太强了, 我也想要]
  - keywords: [我死了, 又死了, 被打死, 挂了, 寄了, 被炸了, 苦力怕, 掉岩浆, 掉虚空]
    chance: 50
    lines: [哈哈哈节哀, 惨, 东西还在吗, 赶紧回去捡, 苦力怕太阴了, 节哀, 啊这, 下次小心点]
  - keywords: [求带, 带带, 带我, 一起玩, 组队, 一起吗, 有人一起]
    chance: 55
    lines: [可以啊, 我在挖矿 你来吗, 我也是新手 哈哈, 等我一下, 一会吧 现在在忙, 我来, 算我一个]
  - keywords: [谁有, 借我, 给我点, 求个, 有没有多余, 谁能给]
    chance: 45
    lines: [我没有, 我也缺, 自己挖吧, 等我回家看看, 我只有一点, 你要多少, 好像没有]
  - keywords: [圈地, 领地, 保护, 怎么传送, 怎么回家, 指令]
    chance: 45
    lines: [菜单里应该有, 我是看公告学的, 问问管理吧, 我也不太会 哈哈, 你按一下菜单看看, 好像有教程]
  - keywords: [管理, 服主, op, 腐竹]
    chance: 35
    lines: [管理好像不在, 不知道诶, 刚才还在, 找管理干啥, 群里问问]
  - keywords: [好无聊, 无聊, 没事干, 没意思]
    chance: 50
    lines: [来挖矿, 我也是, 去打末影龙啊, 建房子去, 无聊+1, 去钓鱼吧, "一起去下界?"]
  - keywords: [饿了, 吃饭, 外卖, 好饿]
    chance: 40
    lines: [我也饿了, 吃啥, 我刚吃完, 带我一份, 去吧去吧]
  - keywords: [好看吗, 漂亮吗, 帅不帅, 看我的房子, 我的房子]
    chance: 40
    lines: [好看, 可以啊, 牛, 有截图吗, 我也想盖, 在哪 我去看看]
  - keywords: [好玩, 服不错, 服挺好]
    chance: 40
    lines: [是挺好玩的, 我玩挺久了, 哈哈 还行, 人还挺多的, 确实]
  - keywords: [生日]
    chance: 70
    responders: [1, 2]
    lines: [生日快乐!, 生日快乐~, "生日快乐 %player%", 快乐快乐]
  - keywords: [加油, 冲冲冲]
    chance: 35
    lines: [加油, 冲, 冲冲冲, 加油加油]

# ── 语料 ──────────────────────────────────────────────────
# 每类里随机挑一句，最近 40 句里说过的尽量换一句。可用 %player% 被回复或被欢迎的人，%other% 另一个在线的测试假人
lines:
  # 被 @ 或叫到名字，且没有规则匹配时
  mention: [在, "?", 咋了, 怎么了, "叫我?", "嗯?", 干嘛, 在呢 有事吗, 来了, 啥事, 怎么啦, 嗯嗯 在]
  # 正在对话时接真人的话
  follow_up: [哈哈, 确实, 对, 嗯嗯, 可以, 好的, 是吧, 我也觉得, 哈哈哈哈, "6", 真的假的, 好家伙, 牛, 有道理, 那还行, 哦哦, 懂了, 好嘞]
  # 测试假人刚问完问题（如“有人一起下矿吗”），真人回了一句时，提问的人接话
  ask_follow_up: [好, 可以, 来, ok, 好嘞, 行, 那来吧, 等你, 好啊, 走走走, 那我在门口等你]
  # 真人问了问题，没有规则匹配时
  unknown_question: [不知道诶, 我也不清楚, 问问管理吧, 这个我也不会, 好像是吧, 不太懂, 你搜搜看, 我也想知道, 不确定 你试试]
  # 真人进服（来过本服）
  welcome: [欢迎, wb, 欢迎回来, 来啦, 欢迎~, "欢迎 %player%", 回来了, "wb %player%", "%player% 来啦"]
  # 真人第一次进服
  welcome_new: [欢迎新人, 新人好~, 欢迎欢迎, "欢迎 %player%", "新人? 欢迎", 欢迎来玩~]
  # 测试假人自己进服时说
  join_greet: [我来了, 大家好, hi, 来了来了, 有人吗, 回来了, 上线, 哈喽, 我又来了 哈哈]
  # 另一个测试假人回应进服的人（%player% 是刚进来的测试假人）
  join_reply: [wb, 欢迎回来, 来啦, "欢迎 %player%", hi~, 嗨, "wb %player%"]
  # 测试假人下线前说
  farewell: ["我下了 88", 吃饭去了, 先下了 明天见, 睡了 晚安, 溜了溜了, 有事先走了, "88", 去写作业了, 下线了, 我先撤了]
  # 另一个测试假人回应要下线的人
  farewell_reply: ["88", 拜拜, 晚安, 慢走, 明天见, bye, "88 %player%"]
  # 冷场时一个人说一句。带 %other% 的句子，被点名的测试假人会接话
  idle:
    - 有人一起下矿吗
    - 刚挖到钻石了 嘿嘿
